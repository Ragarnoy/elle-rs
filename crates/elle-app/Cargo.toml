[package]
name = "elle-app"
version.workspace = true
edition.workspace = true

# The application both airframe binaries run: control loops, RPC dispatch,
# boot sequence and the shared tasks. Each binary keeps only its pins, engine
# setup, interrupt bindings and `main()`.

[dependencies]
elle-config = { workspace = true }
elle-hardware = { workspace = true }
elle-ulog = { workspace = true }
elle-control = { workspace = true }
elle-system = { workspace = true }
elle-rpc-icd = { workspace = true, optional = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-rp = { workspace = true }
embassy-futures = { workspace = true }

bytemuck = { workspace = true }
embedded-hal-bus = { workspace = true }
static_cell = { workspace = true }
postcard-rpc = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

defmt = { workspace = true }

[features]
rpc-control = ["elle-system/rpc-control", "elle-rpc-icd", "postcard-rpc", "heapless", "elle-hardware/gnss-gsv"]
# RC/CRSF pilot commands in RPC mode (TUI keeps monitoring).
rpc-rc = []
gnss = ["elle-hardware/gnss"]
performance-monitoring = ["elle-system/performance-monitoring"]
gyro-raw-log = ["elle-hardware/gyro-raw-log"]

[lib]
test = false
bench = false
