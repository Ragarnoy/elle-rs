[package]
name = "elle-system"
version.workspace = true
edition.workspace = true

[dependencies]
elle-config = { workspace = true }
elle-hardware = { workspace = true }
elle-control = { workspace = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-rp = { workspace = true }
embassy-futures = { workspace = true }

defmt = { workspace = true }
defmt-rtt = { workspace = true, optional = true }
rtt-target = { workspace = true, optional = true }

# RPC dependencies (optional)
postcard-rpc = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
cobs = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
performance-monitoring = ["elle-hardware/performance-monitoring"]  # Enable detailed performance monitoring
defmt-logging = ["defmt-rtt"]  # Use defmt-rtt for logging
rpc-control = ["rtt-target", "postcard-rpc", "postcard", "cobs", "static_cell", "serde"]  # postcard-RPC over RTT

[lib]
test = false
bench = false
