[package]
name = "elle-system"
version.workspace = true
edition.workspace = true

[dependencies]
elle-error = { workspace = true }
elle-config = { workspace = true }
elle-hardware = { workspace = true }
elle-control = { workspace = true }
free-flight-stabilization = { workspace = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-rp = { workspace = true }
embassy-futures = { workspace = true }

defmt = { workspace = true }
defmt-rtt = { workspace = true, optional = true }
rtt-target = { workspace = true, optional = true }

# RPC dependencies (optional)
elle-rpc-icd = { workspace = true, optional = true }
postcard-rpc = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
cobs = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
disable-imu = ["elle-hardware/disable-imu"]  # Stub IMU for board testing without sensor
performance-monitoring = []  # Enable detailed performance monitoring
defmt-logging = ["defmt-rtt"]  # Use defmt-rtt for logging
rpc-control = ["rtt-target", "elle-rpc-icd", "postcard-rpc", "postcard", "cobs", "static_cell", "heapless", "serde"]  # postcard-RPC over RTT

[lib]
test = false
bench = false
