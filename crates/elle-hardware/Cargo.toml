crc = { workspace = true }

cortex-m = "0.7"
defmt = { workspace = true }
libm = { workspace = true }
ahrs = { workspace = true }
nalgebra = { workspace = true }
heapless = { workspace = true }
static_cell = { workspace = true }
sdspi = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc", version = "0.1.0", default-features = false }
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc", version = "0.1.0", default-features = false }
