[package]
name = "elle-hardware"
version.workspace = true
edition.workspace = true

[dependencies]
elle-error = { workspace = true }
elle-config = { workspace = true }
elle-control = { workspace = true }
elle-ulog = { workspace = true, optional = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-rp = { workspace = true }
embassy-futures = { workspace = true }

bno055 = { workspace = true }
bmp390 = { workspace = true }
crsf = { workspace = true }
mmc5616wa = { workspace = true }
embedded-hal-bus = { workspace = true }
uom = { workspace = true }
smart-leds = { workspace = true }
sequential-storage = { workspace = true }

crc = { workspace = true, optional = true }

defmt = { workspace = true }
libm = { workspace = true }
mint = { workspace = true }
heapless = { workspace = true }

[features]
imu-save-calibration = []  # Enable saving IMU calibration to flash
performance-monitoring = []
ulog-logging = ["elle-ulog"]  # Enable ULog flash logging
disable-imu = []  # Disable IMU for debugging (enabled by default, use this flag to disable)
crsf-telemetry = ["crc"]  # Enable CRSF telemetry TX to radio
gnss = []  # Enable GPS telemetry frames (requires crsf-telemetry)

[lib]
test = false
bench = false
