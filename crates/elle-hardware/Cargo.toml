[package]
name = "elle-hardware"
version.workspace = true
edition.workspace = true

[dependencies]
elle-error = { workspace = true }
elle-config = { workspace = true }
elle-control = { workspace = true }
elle-ulog = { workspace = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-rp = { workspace = true }
embassy-futures = { workspace = true }
embassy-dshot = { workspace = true }

icm426xx = { workspace = true }
bmp390 = { workspace = true }
crsf = { workspace = true }
mmc5616wa = { workspace = true }
sam-m10q = { workspace = true }
embedded-hal = { version = "1.0", default-features = false }
embedded-hal-bus = { workspace = true }
uom = { workspace = true }
smart-leds = { workspace = true }
sequential-storage = { workspace = true }
embedded-storage-async = "0.4"
# embassy-rp's PWM divider type
fixed = "1.31"

crc = { workspace = true }

cortex-m = "0.7"
defmt = { workspace = true }
libm = { workspace = true }
nalgebra = { workspace = true }
heapless = { workspace = true }
static_cell = { workspace = true }
# MabezDev/embedded-fatfs, pinned to a git rev: crates.io only carries a 0.0.0
# placeholder for `embedded-fatfs`, and published `block-device-adapters` 0.2.0
# predates the fixes below. `919e569f` (2026-08-28) is upstream HEAD and moves us
# past four bugs this airframe actually hits — no API change from the previous
# `518528cc` pin:
#   - whole-sector writes went straight to DMA, so `write_zeros`' `const [0u8;
#     512]` handed DMA a flash-resident buffer; now copied via a word-aligned
#     stack buffer.
#   - cluster numbers off the disk were used unvalidated, so a directory entry
#     left half-written by a power cut (pointing at the 0x0FFFFFFF erase
#     pattern) overflowed `offset_from_cluster`. We power the aircraft off with
#     logging running, so every flight ends on an unclean unmount.
#   - `File::is_dir` was false for a directory opened by cluster, including the
#     root, so growing the root past one cluster skipped zeroing and reinterpreted
#     stale bytes as entries. Enabling `lfn` below makes each log consume more
#     root-directory entries, which brings that boundary closer.
#   - `block-device-adapters` truncated u64→usize before `min`, so a remaining
#     size that was an exact multiple of 4 GiB produced a zero-length write and a
#     DMA panic.
sdspi = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "919e569f", version = "0.1.0", default-features = false }
# `lfn` (long filenames) is required for lowercase log names: FAT 8.3 short
# names are uppercase by definition, so `LOG_NNNN.ulg` only survives to the card
# as a long-name entry. Costs ~4.2 KB flash and one extra 32-byte directory
# entry per file. See `sd_writer::next_log_name`.
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "919e569f", version = "0.1.0", default-features = false, features = [
    "lfn",
] }
embassy-embedded-hal = { workspace = true }
# `SpiDevice`, for the yielding SD SPI wrapper in `sd_writer`.
embedded-hal-async = "1.0"
aligned = { version = "0.4", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "919e569f", version = "0.2.0", default-features = false }

[features]
gnss = []  # Enable GPS telemetry frames
# Ask the receiver for NMEA GSV (satellites in view). Bench diagnosis only:
# GSV is the only way to see satellites being *tracked*, since the fix reports
# only satellites *used*. Costs ~2.4 kB/s at 5 Hz, so it is enabled solely on
# the fast link — see gnss::config_groups.
gnss-gsv = ["gnss"]
# Execution-time statistics for the IMU loop and flash manager (read by
# elle-system's performance monitor). Enabled by elle-system/performance-monitoring.
performance-monitoring = []
# Log every 1 kHz IMU sample as the raw FIFO integers (`imu_raw`, with
# `imu_raw_mag` and `imu_raw_ctx`), enough to replay the attitude pipeline
# exactly on the host (tools/elle-replay) and to size GYRO_RATE_LPF_HZ from a
# real vibration spectrum. ~20 kB/s extra: bench and test flights only.
imu-raw-log = ["elle-config/imu-raw-log"]
single-engine = []  # Single-engine platform (dart) — uses dshot_single_task instead of dshot_task

[lib]
test = false
bench = false
