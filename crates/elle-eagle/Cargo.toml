[package]
name = "elle-eagle"
version.workspace = true
edition.workspace = true

[dependencies]
elle-config = { workspace = true }
elle-hardware = { workspace = true }
elle-system = { workspace = true }
elle-app = { workspace = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-rp = { workspace = true }
embassy-dshot = { workspace = true }

static_cell = { workspace = true }

compile-time = "0.2"

defmt = { workspace = true }
defmt-rtt = { workspace = true, optional = true }
cortex-m-rt = { workspace = true }
panic-probe = { workspace = true }

[features]
default = ["defmt-logging", "gnss"]
# RC/CRSF pilot commands in RPC mode (requires rpc-control; TUI keeps monitoring).
rpc-rc = ["elle-app/rpc-rc"]
performance-monitoring = ["elle-system/performance-monitoring", "elle-app/performance-monitoring"]
defmt-logging = ["defmt-rtt", "elle-system/defmt-logging"]
rpc-control = ["elle-system/rpc-control", "elle-app/rpc-control"]
gnss = ["elle-hardware/gnss", "elle-app/gnss"]
# Bench vibration capture: every 1 kHz gyro sample to ULog (see elle-hardware).
gyro-raw-log = ["elle-hardware/gyro-raw-log", "elle-app/gyro-raw-log"]

[[bin]]
name = "eagle"
path = "src/main.rs"
test = false
bench = false
