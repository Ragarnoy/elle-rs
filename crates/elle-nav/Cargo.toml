[package]
name = "elle-nav"
version.workspace = true
edition.workspace = true

[dependencies]
elle-config = { workspace = true }
libm = { workspace = true }
# Typed WGS84 / ECEF / NED frames at the home-frame boundary. Its `serde`
# feature does not build without `std` (serde_core), so it stays off.
sguaba = { version = "0.10", default-features = false, features = ["libm"] }
uom = { workspace = true, features = ["f64"] }

[lib]
test = false
bench = false
