[package]
name = "elle-dart"
version.workspace = true
edition.workspace = true

[dependencies]
elle-config = { workspace = true, features = ["platform-dart"] }
elle-hardware = { workspace = true, features = ["single-engine"] }
elle-ulog = { workspace = true }
elle-control = { workspace = true }
elle-system = { workspace = true }
elle-app = { workspace = true }
elle-rpc-icd = { workspace = true, optional = true }
sam-m10q = { workspace = true, optional = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-rp = { workspace = true }
embassy-futures = { workspace = true }
embassy-dshot = { workspace = true }
embedded-hal-bus = { workspace = true }

static_cell = { workspace = true }
postcard-rpc = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

compile-time = "0.2"

defmt = { workspace = true }
defmt-rtt = { workspace = true, optional = true }
cortex-m-rt = { workspace = true }
panic-probe = { workspace = true }

[features]
default = ["defmt-logging", "gnss"]
performance-monitoring = ["elle-system/performance-monitoring", "elle-app/performance-monitoring"]
defmt-logging = ["defmt-rtt", "elle-system/defmt-logging"]
rpc-control = ["elle-system/rpc-control", "elle-app/rpc-control", "elle-rpc-icd", "postcard-rpc", "postcard", "heapless", "elle-hardware/gnss-gsv"]
gnss = ["sam-m10q", "elle-hardware/gnss", "elle-app/gnss"]
# Bench vibration capture: every 1 kHz gyro sample to ULog (see elle-hardware).
gyro-raw-log = ["elle-hardware/gyro-raw-log", "elle-app/gyro-raw-log"]

[[bin]]
name = "dart"
path = "src/main.rs"
test = false
bench = false
