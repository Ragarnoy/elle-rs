[package]
name = "elle-control"
version.workspace = true
edition.workspace = true

[dependencies]
elle-config = { workspace = true }

embassy-time = { workspace = true }
defmt = { workspace = true }
bytemuck = { workspace = true }
nalgebra = { workspace = true }
uf-ahrs = { workspace = true }
libm = { workspace = true }

[features]
# Passthrough so host tests can select the dart tables:
#   cargo test -p elle-control --target x86_64-unknown-linux-gnu --features platform-dart
platform-dart = ["elle-config/platform-dart"]

[lib]
test = false
bench = false

# Proposal 0007 equivalence oracle: the pre- and post-refactor FlightController
# build on the host against shims, on embassy-time's mock clock. Host-only, so
# the firmware target never resolves them.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
embassy-time = { workspace = true, features = ["mock-driver"] }
embassy-sync = { workspace = true }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
critical-section = { version = "1.2", features = ["std"] }
sha2 = "0.10"
