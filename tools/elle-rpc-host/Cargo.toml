[package]
name = "elle-rpc-host"
version.workspace = true
edition.workspace = true
description = "Host CLI tool for Elle flight controller RPC over RTT"

[[bin]]
name = "elle"
path = "src/main.rs"

[dependencies]
elle-config = { workspace = true }
elle-rpc-icd = { workspace = true, features = ["use-std"] }
postcard-rpc = { workspace = true, features = ["use-std"] }
cobs = { workspace = true }

probe-rs = { version = "0.32", default-features = false, features = ["builtin-targets"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
chrono = "0.4"
# MCP server (`elle mcp`): stdio transport, tool macros, JSON schemas for tool inputs.
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A fake device on the real HostClient path, and an in-memory MCP client.
postcard-rpc = { workspace = true, features = ["use-std", "test-utils"] }
postcard = { workspace = true, features = ["use-std"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "client"] }
