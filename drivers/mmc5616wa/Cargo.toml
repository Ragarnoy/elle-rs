[package]
name = "mmc5616wa"
version.workspace = true
edition.workspace = true
description = "Driver for the MEMSIC MMC5616WA 3-axis magnetometer"

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = { version = "1.0", optional = true }

[features]
defmt = ["dep:defmt"]
async = ["dep:embedded-hal-async"]

[dependencies.defmt]
version = "1.0"
optional = true

# Tests use embedded-hal-mock, but adding it as a dev-dependency pulls
# std-requiring transitive deps that break the no_std workspace build.
# To run tests, temporarily add to [dev-dependencies]:
#   embedded-hal-mock = { version = "0.11", features = ["eh1"] }
# Then: cargo test -p mmc5616wa --target x86_64-unknown-linux-gnu
