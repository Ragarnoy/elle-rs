[package]
name = "bmp390"
version = "0.4.3"
edition = "2021"
authors = ["Adam Sasine <adam.sasine@gmail.com>"]
description = "Asynchronous driver for the BMP390/BMP384 pressure sensor"
homepage = "https://github.com/asasine/bmp390"
repository = "https://github.com/asasine/bmp390"
license = "MIT"
keywords = ["embedded-hal", "async", "pressure", "sensor"]
categories = ["aerospace", "embedded", "hardware-support", "no-std"]

[features]
# embassy-time intentionally has no dep — the async driver conflicts with the workspace's
# pinned git embassy-time. Declared as an empty feature so cfg(feature="embassy-time")
# in the source compiles without warnings.
embassy-time = []
sync = ["dep:embedded-hal"]

[dependencies]
defmt = "0.3.8"
embedded-hal-async = "1.0.0"
embedded-hal = { version = "1.0.0", optional = true }
libm = "0.2.8"
uom = { version = "0.36.0", default-features = false, features = ["f32", "si", "autoconvert"] }

[dev-dependencies]
defmt = { version = "0.3.8", features = ["unstable-test"] }
embedded-hal-mock = { version = "0.11.0", default-features = false, features = ["eh1", "embedded-hal-async"] }
