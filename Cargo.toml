[workspace]
resolver = "2"
members = [
    "crates/elle-error",
    "crates/elle-config",
    "crates/elle-hardware",
    "crates/elle-control",
    "crates/elle-system",
    "crates/elle-ulog",
    "crates/elle-rpc-icd",
    "crates/elle-eagle",
    "tools/elle-rpc-host",
    "drivers/mmc5616wa",
    "drivers/sam-m10q",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
elle-error = { path = "crates/elle-error" }
elle-config = { path = "crates/elle-config" }
elle-hardware = { path = "crates/elle-hardware" }
elle-control = { path = "crates/elle-control" }
elle-system = { path = "crates/elle-system" }
elle-ulog = { path = "crates/elle-ulog" }
elle-rpc-icd = { path = "crates/elle-rpc-icd" }
mmc5616wa = { path = "drivers/mmc5616wa", features = ["defmt"] }
sam-m10q = { path = "drivers/sam-m10q", features = ["defmt"] }

# External dependencies - Embassy ecosystem
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-rp = { version = "0.9.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git" }

# External dependencies - Hardware drivers
bno055 = "0.4.0"
crsf = { git = "https://github.com/tact1m4n3/crsf-rs.git", default-features = false, features = ["defmt"] }
smart-leds = "0.4.0"

# External dependencies - Control algorithms
free-flight-stabilization = { git = "https://github.com/AeroRust/free-flight-stabilization.git", branch = "fix/no_std-support-for-f32-f64", default-features = false }

# External dependencies - System libraries
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
libm = "0.2.15"
mint = "0.5.9"
static_cell = "2.1.1"
rtt-target = { version = "0.6.1", features = ["defmt"] }
thiserror = { version = "2.0.17", default-features = false }
sequential-storage = { version = "6.0.*", default-features = false }
heapless = "0.9"
postcard = { version = "1.1", default-features = false }
postcard-rpc = { version = "0.12", default-features = false }
postcard-schema = { version = "0.2", default-features = false, features = ["derive"] }
bmp390 = { version = "0.4", default-features = false, features = ["sync"] }
embedded-hal-bus = { version = "0.2", default-features = false }
uom = { version = "0.36", default-features = false, features = ["f32", "si"] }
cobs = { version = "0.5", default-features = false }
crc = { version = "3", default-features = false }
embedded-io = "0.7"
serde = { version = "1.0", default-features = false, features = ["derive"] }

[profile.release]
debug = 2
lto = true
codegen-units = 1
